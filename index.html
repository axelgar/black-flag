<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13508F">
<!-- Add to Home Screen → launches chromeless, the sea gets the whole display.
     iOS wants the apple- prefixed key; the unprefixed one covers Android. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Black Flag</title>
<!-- Installable: Android puts it on the home screen full screen and sideways; iOS takes
     the icon for Add to Home Screen. Drawn by scripts/icons.ts. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Google Fonts CDN. Self-host before anywhere with bad wifi. -->
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="app" id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <main id="ui" class="ui"></main>
  <div class="boot" id="boot"><div class="logo">Black <span>Flag</span></div></div>
</div>

<!-- The sea is sailed sideways: the name screen works upright, but at sea a phone held
     upright is asked to turn. -->
<div class="rotate" role="status">
  <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
    <rect x="15" y="6" width="16" height="34" rx="3" stroke="currentColor" stroke-width="2"/>
    <path d="M8 30a15 15 0 0 0 4 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 24l2 7 7-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="big">Turn your phone sideways</div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
